<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>명하람 | 프로필</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="profile">
      <!-- 프로필 사진: images 폴더에 본인 사진을 넣고 src를 바꾸세요 -->
      <img class="avatar" src="images/profile.svg" alt="명하람 프로필 사진">
      <h1 class="name">명하람</h1>
      <p class="role">위기관리 PR · 헬스 커뮤니케이션 연구 학생</p>
    </header>

    <section class="section">
      <h2>자기소개</h2>
      <p>
        안녕하세요! 위기관리 PR과 헬스 커뮤니케이션을 연구하는 학생 명하람입니다.
        위기 상황에서 조직이 공중과 어떻게 소통해야 신뢰를 지킬 수 있는지,
        그리고 건강 정보가 사람들에게 정확하고 효과적으로 전달되려면 무엇이 필요한지에 관심을 가지고 공부하고 있습니다.
      </p>
    </section>

    <section class="section">
      <h2>관심 분야</h2>
      <ul class="tags">
        <li>위기관리 PR</li>
        <li>헬스 커뮤니케이션</li>
        <li>위기 커뮤니케이션</li>
        <li>리스크 커뮤니케이션</li>
        <li>건강 캠페인</li>
      </ul>
    </section>

    <section class="section contact">
      <h2>연락처</h2>
      <a class="email-btn" href="mailto:hello@example.com">
        <span aria-hidden="true">✉</span> hello@example.com
      </a>
    </section>
  </main>

  <footer class="footer">© 2026 명하람</footer>
</body>
</html>
