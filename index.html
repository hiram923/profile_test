<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 프로필</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="profile">
      <!-- 프로필 사진: images 폴더에 본인 사진을 넣고 src를 바꾸세요 -->
      <img class="avatar" src="images/profile.svg" alt="홍길동 프로필 사진">
      <h1 class="name">홍길동</h1>
      <p class="role">연세대학교 학생 · 웹 개발 입문자</p>
    </header>

    <section class="section">
      <h2>자기소개</h2>
      <p>
        안녕하세요! 새로운 기술을 배우고 직접 만들어 보는 것을 좋아하는 홍길동입니다.
        사람들에게 도움이 되는 서비스를 만드는 것이 목표이며,
        요즘은 웹 개발과 AI 활용에 관심을 가지고 공부하고 있습니다.
      </p>
    </section>

    <section class="section">
      <h2>관심 분야</h2>
      <ul class="tags">
        <li>웹 개발</li>
        <li>인공지능</li>
        <li>UX 디자인</li>
        <li>데이터 분석</li>
        <li>사진</li>
      </ul>
    </section>

    <section class="section contact">
      <h2>연락처</h2>
      <a class="email-btn" href="mailto:hello@example.com">
        <span aria-hidden="true">✉</span> hello@example.com
      </a>
    </section>
  </main>

  <footer class="footer">© 2026 홍길동</footer>
</body>
</html>
